name: CI/CD Pipeline

# Se ejecuta al hacer push o pull request a la rama main
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ==========================================
  # FASE DE INTEGRACIÓN CONTINUA (CI)
  # ==========================================
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas y reporte de cobertura (Code Coverage)
        run: |
          python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Iniciar sesión en Docker Hub de forma segura
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir imagen a Docker Hub con doble tag
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/api-tareas:latest
            ${{ secrets.DOCKER_USERNAME }}/api-tareas:${{ github.sha }}

  # ==========================================
  # FASE DE DESPLIEGUE CONTINUO (CD)
  # ==========================================
  deploy:
    # Solo despliega si las pruebas pasaron exitosamente y es un push
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Conectar a AWS EC2 y Desplegar
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Script que se ejecuta dentro del servidor de AWS
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/api-tareas:latest
            sudo docker stop ec2-api || true
            sudo docker rm ec2-api || true
            sudo docker run -d -p 80:80 --name ec2-api ${{ secrets.DOCKER_USERNAME }}/api-tareas:latest
